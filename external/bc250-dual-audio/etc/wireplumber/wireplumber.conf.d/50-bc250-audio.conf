# BC-250 dual-output audio policy
#
# Visible outputs:
#   1. The normal ACP HDMI/DP sink (untouched channel layout, EDID/ELD driven)
#   2. Dolby Digital 5.1 (AC3 Encoder) (permanent virtual frontend)
#
# The custom policy makes these two outputs a mutually-exclusive system mode:
# all normal application playback streams are forced to the currently selected
# global output. The hidden A52 backend is created only in AC3 mode.

monitor.alsa.rules = [
  {
    matches = [
      {
        device.name = "alsa_card.pci-0000_01_00.1"
      }
    ]
    actions = {
      update-props = {
        # Explicitly return the card to WirePlumber's stock ACP profile set.
        # Native PCM channel count / map remains entirely ELD/EDID-driven.
        device.profile-set = "default.conf"
        api.acp.disable-pro-audio = true

        # Used by our WirePlumber 0.5.17-based ALSA-monitor guard for safe
        # native HDMI profile re-creation (e.g. desktop / hotplug transitions).
        bc250.profile-switch-delay-ms = 1000
      }
    }
  }

  {
    matches = [
      {
        node.name = "~alsa_output.pci-0000_01_00.1.hdmi-.*"
      }
    ]
    actions = {
      update-props = {
        # Release hw:Generic,3 immediately when no stream is linked to the
        # native HDMI node. The AC3 policy waits for SUSPENDED before opening
        # its own backend.
        node.suspend-on-idle = true
      }
    }
  }
]

# Do not remember contradictory per-application targets such as
# Firefox -> AC3 and Spotify -> native HDMI. The custom select-target hook
# also overrides such moves at runtime, making output selection global.
stream.rules = [
  {
    matches = [
      {
        media.class = "Stream/Output/Audio"
      }
    ]
    actions = {
      update-props = {
        state.restore-target = false
      }
    }
  }

  # KDE / pavucontrol-style peak meters capture sink monitor ports. Do not
  # restore an old per-sink target for those streams; the v0.7 select-target
  # hook makes them follow the currently selected global BC-250 output.
  {
    matches = [
      {
        media.class = "Stream/Input/Audio"
        stream.capture.sink = true
      }
    ]
    actions = {
      update-props = {
        state.restore-target = false
      }
    }
  }
]

wireplumber.settings = {
  # Keep target metadata changes/rescans working. Our first select-target hook
  # is the authority for the BC-250 native/AC3 pair.
  linking.allow-moving-streams = true
  linking.follow-default-target = true
}

# Static configuration consumed by 90-bc250-audio-mode.lua
bc250.audio.properties = {
  native-node-prefix = "alsa_output.pci-0000_01_00.1.hdmi-"

  ac3-frontend-node = "bc250_ac3"
  ac3-backend-node = "bc250_ac3_backend"
  ac3-alsa-path = "plug:bc250_a52"

  switch-delay-ms = 1000
  native-poll-ms = 50
  backend-retry-ms = 1000
  api-alsa-start-delay = 1536
  startup-settle-ms = 1500
  native-probe-timeout-ms = 5000
}

# Internal runtime hand-off between the BC-250 arbiter and the patched ALSA
# monitor. These settings are deliberately NOT saved; every WirePlumber start
# begins unlocked and lets the normal native HDMI node enumerate first.
wireplumber.settings.schema = {
  bc250.audio.ac3-hardware-lock = {
    description = "BC-250 internal: AC3 owns the HDMI ALSA PCM"
    type = "bool"
    default = false
  }

  bc250.audio.native-probe-request = {
    description = "BC-250 internal: native HDMI needs a safe reprobe while AC3 is active"
    type = "bool"
    default = false
  }
}

wireplumber.settings = {
  bc250.audio.ac3-hardware-lock = false
  bc250.audio.native-probe-request = false
}

wireplumber.components = [
  {
    name = "90-bc250-audio-mode.lua"
    type = script/lua
    provides = hooks.bc250.audio-mode
  }
]

wireplumber.profiles = {
  main = {
    hooks.bc250.audio-mode = required
  }
}
