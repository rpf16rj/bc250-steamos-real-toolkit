# BC-250 native / Dolby Digital global audio policy
#
# Visible outputs:
#   1. normal ACP HDMI/DP sink (untouched; EDID/ELD driven)
#   2. dolby_digital_ac3      - Dolby Digital 5.1, AC-3 @ 448 kbps
#
# Only one backend may own the BC-250 HDMI ALSA PCM at a time. Output selection
# in Steam/KDE therefore selects a GLOBAL mode; per-application splits between
# native/AC3 are intentionally prevented.

monitor.alsa.rules = [
  {
    matches = [
      {
        device.name = "alsa_card.pci-0000_01_00.1"
      }
    ]
    actions = {
      update-props = {
        # Keep native HDMI/DP completely stock. Channel count and channel map
        # are whatever ACP derives from ELD/EDID.
        device.profile-set = "default.conf"
        api.acp.disable-pro-audio = true

        # Used by the WirePlumber 0.5.17-based BC-250 ALSA-monitor guard.
        bc250.profile-switch-delay-ms = 1000
      }
    }
  }

  {
    matches = [
      {
        node.name = "~alsa_output.pci-0000_01_00.1.hdmi-.*"
      }
    ]
    actions = {
      update-props = {
        # Native must release hw:Generic,3 promptly before either encoded
        # backend is allowed to take ownership.
        node.suspend-on-idle = true
      }
    }
  }
]

# Global output means no remembered Firefox->encoded / Spotify->native split.
stream.rules = [
  {
    matches = [
      {
        media.class = "Stream/Output/Audio"
      }
    ]
    actions = {
      update-props = {
        state.restore-target = false
      }
    }
  }

  # KDE / pavucontrol peak meters capture sink monitor ports. Make these follow
  # the global mode too so a meter cannot wake native HDMI while AC3 owns
  # the hardware.
  {
    matches = [
      {
        media.class = "Stream/Input/Audio"
        stream.capture.sink = true
      }
    ]
    actions = {
      update-props = {
        state.restore-target = false
      }
    }
  }
]

wireplumber.settings = {
  linking.allow-moving-streams = true
  linking.follow-default-target = true
}

# Static configuration consumed by 90-bc250-audio-mode.lua
bc250.audio.properties = {
  native-node-prefix = "alsa_output.pci-0000_01_00.1.hdmi-"

  ac3-frontend-node = "dolby_digital_ac3"
  ac3-backend-node = "dolby_digital_ac3_backend"
  ac3-alsa-path = "plug:bc250_a52"

  switch-delay-ms = 1000
  native-poll-ms = 50
  backend-retry-ms = 1000
  api-alsa-start-delay = 1536
  startup-settle-ms = 1500
  native-probe-timeout-ms = 5000
}

# Runtime hand-off between the arbiter and patched ALSA monitor. The historical
# setting name contains "ac3" for upgrade compatibility; it means the AC-3
# backend owns / reserves hw:Generic,3.
wireplumber.settings.schema = {
  bc250.audio.ac3-hardware-lock = {
    description = "BC-250 internal: encoded backend owns/reserves the HDMI ALSA PCM"
    type = "bool"
    default = false
  }

  bc250.audio.native-probe-request = {
    description = "BC-250 internal: native HDMI needs a safe reprobe while an encoded backend is active"
    type = "bool"
    default = false
  }
}

wireplumber.settings = {
  bc250.audio.ac3-hardware-lock = false
  bc250.audio.native-probe-request = false
}

wireplumber.components = [
  {
    name = "90-bc250-audio-mode.lua"
    type = script/lua
    provides = hooks.bc250.audio-mode
  }
]

wireplumber.profiles = {
  main = {
    hooks.bc250.audio-mode = required
  }
}
