# BC-250 realtime Dolby Digital 5.1 backend.
# The visible sink is named dolby_digital_ac3; this internal PCM name remains stable
# so upgrades do not need to change the proven ALSA path.
#
# v0.12: the slave is now the hdmi: device with explicit IEC61937 channel
# status instead of a bare hw:Generic,3.
#
#   AES0=0x06  consumer mode with the non-audio bit SET. This is what tells a
#              receiver "decode this as Dolby", instead of treating the
#              compressed bitstream as PCM and playing it as noise.
#   AES3=0x02  declares 48 kHz. Left unset the card reported 44100 while the
#              stream was actually 48 kHz.
#
# hw: cannot carry AES parameters at all, which is why they were absent before.
# Most receivers auto-detect the AC-3 sync word regardless, but strict sinks --
# notably TVs forwarding audio to a receiver over ARC -- do honour the bit.
pcm.bc250_a52 {
    type a52
    slavepcm "hdmi:CARD=Generic,DEV=0,AES0=0x06,AES1=0x82,AES2=0x00,AES3=0x02"
    rate 48000
    channels 6
    bitrate 448
}

# Pre-v0.12 behaviour, kept as a switchable fallback: no channel status is set,
# so the non-audio bit stays clear. Select it by setting
#   bc250.audio.properties.ac3-alsa-path = "plug:bc250_a52_noaes"
# in 50-bc250-audio.conf, then restarting wireplumber. Useful if a receiver
# turns out to mishandle a correctly flagged stream.
pcm.bc250_a52_noaes {
    type a52
    slavepcm "hw:Generic,3"
    rate 48000
    channels 6
    bitrate 448
}
