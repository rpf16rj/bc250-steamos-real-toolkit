# BC-250 realtime AC3 (A52) encoder backend.
#
# This PCM is intentionally NOT the default ALSA device. WirePlumber opens it
# only while the visible "Dolby Digital 5.1 (AC3 Encoder)" PipeWire output is
# the selected system output.
#
# The physical BC-250 DisplayPort/HDMI audio path is the HDA card named
# "Generic", PCM device 3. Using the ALSA card name instead of card number 0
# keeps this working if another sound card changes ALSA's numeric ordering.
pcm.bc250_a52 {
    type a52
    slavepcm "hw:Generic,3"
    rate 48000
    channels 6
    bitrate 448
}
