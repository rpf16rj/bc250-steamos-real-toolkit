# Permanent user-visible AC3 frontend.
#
# This is a six-channel NULL sink. It NEVER opens hw:Generic,3 itself.
# WirePlumber dynamically creates a hidden A52 hardware backend + loopback
# only while this sink is the selected default output. That keeps the normal
# HDMI/DP sink completely native and EDID/ELD-driven.
context.objects = [
  {
    factory = adapter
    args = {
      factory.name = support.null-audio-sink

      node.name = "bc250_ac3"
      node.description = "Dolby Digital 5.1 (AC3 Encoder)"
      node.nick = "Dolby Digital 5.1"
      media.class = "Audio/Sink"

      # Steam/gamescope filters out virtual sinks (node.virtual=true) and
      # requires device.class="sound" to list a sink in its audio settings.
      # Without these properties the AC3 sink is invisible in Steam's
      # audio settings even though it appears in wpctl/pavucontrol.
      node.virtual = false
      device.class = "sound"
      device.bus = "pci"
      device.api = "alsa"
      device.icon_name = "audio-card-display"

      # Keep the AC3 carrier alive while this mode is selected. The null sink
      # must continue producing silence so the monitor -> A52 bridge keeps
      # feeding valid AC3 frames to TVs / soundbars / AVRs between sounds.
      node.always-process = true
      node.pause-on-idle = false
      node.suspend-on-idle = false
      session.suspend-timeout-seconds = 0

      audio.rate = 48000
      audio.channels = 6
      audio.position = [ FL FR RL RR FC LFE ]

      # Keep the real HDMI/DP output preferable on a fresh profile/state.
      # A user selection made in Steam/KDE is still remembered by WirePlumber.
      priority.session = 100
      priority.driver = 1

      monitor.channel-volumes = true
      monitor.passthrough = true

      adapter.auto-port-config = {
        mode = dsp
        monitor = true
        position = preserve
      }
    }
  }
]
