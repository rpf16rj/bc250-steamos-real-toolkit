# Permanent user-visible encoded-audio frontends.
#
# These are six-channel NULL sinks. They NEVER open hw:Generic,3 themselves.
# WirePlumber dynamically attaches exactly one hardware backend while an
# encoded output is selected:
#   * dolby_digital_ac3  -> ALSA a52 -> AC-3 5.1 @ 448 kbps
#   * dolby_digital_plus -> PCM FIFO -> FFmpeg E-AC-3 @ 768 kbps -> IEC61937
#
# The normal HDMI/DP sink remains stock ACP and fully EDID/ELD-driven.
context.objects = [
  {
    factory = adapter
    args = {
      factory.name = support.null-audio-sink

      # SteamOS Game Mode exposes node.name in its output selector.
      # Use a human-readable name so it shows "Dolby Digital AC3" instead
      # of a technical identifier like "bc250_ac3_448".
      node.name = "dolby_digital_ac3"
      node.description = "Dolby Digital AC3"
      node.nick = "Dolby Digital AC3"
      media.class = "Audio/Sink"

      # Steam/gamescope filters out virtual sinks (node.virtual=true) and
      # requires device.class="sound" to list a sink in its audio settings.
      node.virtual = false
      device.class = "sound"
      device.bus = "pci"
      device.api = "alsa"
      device.icon_name = "audio-card-display"

      # Keep processing silence while selected. The monitor bridge therefore
      # continues feeding valid AC-3 frames and TVs / soundbars / AVRs retain
      # their Dolby lock between application sounds.
      node.always-process = true
      node.pause-on-idle = false
      node.suspend-on-idle = false
      session.suspend-timeout-seconds = 0

      audio.rate = 48000
      audio.channels = 6
      audio.position = [ FL FR RL RR FC LFE ]

      # Native HDMI/DP must win automatic selection on a fresh state.
      priority.session = 100
      priority.driver = 1

      monitor.channel-volumes = true
      monitor.passthrough = true

      adapter.auto-port-config = {
        mode = dsp
        monitor = true
        position = preserve
      }
    }
  }

  {
    factory = adapter
    args = {
      factory.name = support.null-audio-sink

      node.name = "dolby_digital_plus"
      node.description = "Dolby Digital Plus (E-AC3)"
      node.nick = "Dolby Digital Plus (E-AC3)"
      media.class = "Audio/Sink"

      # Same gamescope/SteamOS visibility flags as AC-3.
      node.virtual = false
      device.class = "sound"
      device.bus = "pci"
      device.api = "alsa"
      device.icon_name = "audio-card-display"

      # Same keepalive semantics as AC-3. The actual FFmpeg/IEC61937 hardware
      # backend exists only while this output is the global configured target.
      node.always-process = true
      node.pause-on-idle = false
      node.suspend-on-idle = false
      session.suspend-timeout-seconds = 0

      audio.rate = 48000
      audio.channels = 6
      # FFmpeg native 5.1 order — must match the E-AC-3 pipe-tunnel backend
      # and bridge so PCM is interpreted correctly without a pan filter.
      audio.position = [ FL FR FC LFE RL RR ]

      # Lower than AC-3 so neither encoded output becomes an automatic default.
      priority.session = 90
      priority.driver = 1

      monitor.channel-volumes = true
      monitor.passthrough = true

      adapter.auto-port-config = {
        mode = dsp
        monitor = true
        position = preserve
      }
    }
  }
]
